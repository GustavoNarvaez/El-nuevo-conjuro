<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Página</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: white;

            /* Fondo morado */
            background:
                radial-gradient(circle at top left, #9b59ff 0%, transparent 35%),
                radial-gradient(circle at bottom right, #5b21b6 0%, transparent 40%),
                linear-gradient(135deg, #240046, #3c096c, #5a189a);

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .contenedor {
            width: 100%;
            max-width: 700px;
            text-align: center;
            padding: 45px 30px;

            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.20);
            border-radius: 25px;

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin-top: 0;
            font-size: 42px;
            margin-bottom: 10px;
        }

        .descripcion {
            font-size: 18px;
            color: #eee;
            margin-bottom: 30px;
        }

        /* Imagen */
        .imagen {
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            display: block;
            margin: 0 auto 25px;

            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);

            transition: transform 0.3s ease,
                        box-shadow 0.3s ease;
        }

        .imagen:hover {
            transform: scale(1.03);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5);
        }

        /* Botón */
        .boton {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;

            padding: 16px 32px;
            margin: 10px;

            border-radius: 50px;

            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;

            transition: all 0.3s ease;

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        /* Botón YouTube */
        .youtube {
            background: linear-gradient(135deg, #ff0000, #c40000);
        }

        .youtube:hover {
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 12px 30px rgba(255, 0, 0, 0.45);
        }

        /* Segundo botón */
        .boton-morado {
            background: linear-gradient(135deg, #a855f7, #7e22ce);
        }

        .boton-morado:hover {
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 12px 30px rgba(168, 85, 247, 0.5);
        }

        .icono {
            font-size: 23px;
        }

        footer {
            margin-top: 30px;
            font-size: 14px;
            color: #ddd;
        }

        /* Adaptación para celulares */
        @media (max-width: 600px) {

            h1 {
                font-size: 32px;
            }

            .contenedor {
                padding: 35px 20px;
            }

            .boton {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <main class="contenedor">

        <h1>🎵 Mi Página</h1>

        <p class="descripcion">
            Haz clic en la imagen o en el botón para ver el video.
        </p>

        <!-- La imagen también funciona como botón -->
        <a href="https://www.youtube.com/watch?v=qcR1KbbhRTs&list=RDYZkKF_4XU4o&index=3"
           target="_blank"
           rel="noopener noreferrer">

            <img
                class="imagen"
                src="117721914_3524966407534048_4765637899328162814_n.jpg"
                alt="Imagen del video">
        </a>

        <!-- Botón principal -->
        <a class="boton youtube"
           href="https://www.youtube.com/watch?v=qcR1KbbhRTs&list=RDYZkKF_4XU4o&index=3"
           target="_blank"
           rel="noopener noreferrer">

            <span class="icono">▶</span>
            Ver video en YouTube

        </a>

        <!-- Segundo botón -->
        <a class="boton boton-morado"
           href="https://www.youtube.com/watch?v=qcR1KbbhRTs&list=RDYZkKF_4XU4o&index=3"
           target="_blank"
           rel="noopener noreferrer">

            <span class="icono">🎵</span>
            Escuchar ahora

        </a>

        <footer>
            © 2026 · Mi página
        </footer>

    </main>

</body>
</html>
